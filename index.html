<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1033" />
    <title>BOSS MODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch-surface"></div>
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div id="labels"></div>
    <div id="vignette"></div>
    <div id="frenzy"></div>

    <div id="hud" class="hidden">
      <div id="xpbar"><div id="xpfill"></div><span id="lvl">LV 1</span></div>
      <div id="topline">
        <div id="bars">
          <div id="hpbox"><div id="hpfill"></div><span id="hptext">100</span></div>
          <div id="vaultbox"><div id="vaultfill"></div><span id="vaulttext">💰 100</span></div>
        </div>
        <div id="timer">0:00</div>
        <div id="kills">💀 0</div>
      </div>
      <div id="champbar" class="hidden"><div id="champname">CHAMPION</div><div id="champtrack"><div id="champfill"></div></div></div>
      <div id="killfeed"></div>
      <div id="markers"></div>
      <div id="combo"></div>
      <div id="abilities"></div>
      <div id="buttons">
        <button id="btn-mute" title="Sound">🔊</button>
        <button id="btn-pause" title="Pause">⏸</button>
      </div>
      <button id="roar"><div id="ragefill"></div><span>ROAR</span></button>
    </div>

    <div id="buildbar" class="hidden">
      <div id="build-top"><span id="build-title">NIGHT 1</span><span id="build-gold">💰 100</span></div>
      <div id="build-msg"></div>
      <div id="build-bottom">
        <div id="tools"></div>
        <button class="tool repair" id="btn-repair" hidden></button>
        <button class="big" id="btn-raid">START NIGHT 1 ▶</button>
      </div>
    </div>

    <div id="challenger" class="screen hidden">
      <p class="kicker">NEW CHALLENGER!</p>
      <div id="ch-art"></div>
      <h2 id="ch-name"></h2>
      <p id="ch-text"></p>
      <button class="big" id="btn-challenger">Got it</button>
    </div>

    <div id="dawn" class="screen hidden">
      <h2 id="dawn-title">NIGHT 1 SURVIVED!</h2>
      <div id="dawn-stars">⭐⭐⭐</div>
      <div id="dawn-stats" class="stats"></div>
      <p id="dawn-adapt"></p>
      <p id="dawn-hint" class="hint"></p>
      <button class="big" id="btn-next">Build ▶</button>
    </div>

    <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>

    <div id="title" class="screen">
      <h1>BOSS<span>MODE</span></h1>
      <p class="tag-line">For once, <b>YOU</b> are the final boss.<br />The heroes are coming to steal your treasure.</p>
      <button class="big" id="btn-continue" hidden>Continue</button>
      <div id="boss-pick"></div>
      <div id="difficulty"></div>
      <p id="difficulty-hint" class="hint"></p>
      <p class="hint">Move: WASD / arrows / drag · ROAR: Space · Attacks are automatic</p>
      <p id="best"></p>
      <div id="name-row">You are <b id="player-name"></b> <button id="btn-reroll" title="New name"></button></div>
      <div id="board" class="board"></div>
    </div>

    <div id="levelup" class="screen hidden">
      <h2>LEVEL UP!</h2>
      <div id="cards"></div>
    </div>

    <div id="pause" class="screen hidden">
      <h2>PAUSED</h2>
      <button class="big" id="btn-resume">Keep smashing</button>
      <button class="big ghost" id="btn-quit">Quit to menu</button>
    </div>

    <div id="end" class="screen hidden">
      <h2 id="end-title"></h2>
      <p id="end-sub"></p>
      <div id="end-stats"></div>
      <p id="end-score"></p>
      <div id="end-board" class="board"></div>
      <button class="big" id="btn-retry" hidden>Retry this night</button>
      <button class="big ghost" id="btn-again">New season</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
